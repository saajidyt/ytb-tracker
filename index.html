<style>
  :root {
    --bg: #f3f4f6; --surface: #ffffff; --surface2: #f9fafb; --line: #e5e7eb; --line2: #f0f1f3;
    --text: #111827; --text2: #374151; --muted: #6b7280;
    --head: #111827; --head2: #1f2937; --headText: #ffffff; --headMuted: #d1d5db;
    --accent: #ea580c; --accentText: #ffffff; --accentSoft: #fff1e8;
    --red: #b91c1c; --redBg: #fee2e2; --orange: #c2410c; --orangeBg: #ffedd5; --green: #047857; --greenBg: #d1fae5;
    --longBg: #eef2ff; --longText: #4338ca; --shortBg: #fdf2f8; --shortText: #be185d;
    --chip: #e5e7eb; --shadow: 0 1px 2px rgba(17,24,39,.05); --shadowLg: 0 20px 50px rgba(0,0,0,.18);
    --overlay: rgba(17,24,39,.45);
  }
  [data-theme="dark"] {
    --bg: #0b0e14; --surface: #161b26; --surface2: #1d2331; --line: #2f3747; --line2: #262d3b;
    --text: #f2f4f8; --text2: #d6dbe5; --muted: #a8b0c2;
    --head: #10141c; --head2: #222a39; --headText: #ffffff; --headMuted: #c3cad8;
    --accent: #ff8a4c; --accentText: #1a0c04; --accentSoft: #3a2213;
    --red: #ff9b9b; --redBg: #4a1d1d; --orange: #ffbf8a; --orangeBg: #47290f; --green: #7ef0c1; --greenBg: #123b30;
    --longBg: #262d55; --longText: #c3cbff; --shortBg: #4a1d3d; --shortText: #ffb3dc;
    --chip: #2a3243; --shadow: 0 1px 0 rgba(255,255,255,.03); --shadowLg: 0 24px 60px rgba(0,0,0,.65);
    --overlay: rgba(0,0,0,.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .grot { font-family: "Space Grotesk", Inter, sans-serif; }

  /* buttons + inputs */
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accentText); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--red); }
  .btn.danger.confirm { background: var(--red); border-color: var(--red); color: var(--surface); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 12px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .input { height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
  .input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .err { color: var(--red); font-size: 12px; min-height: 16px; }
  .ok-msg { color: var(--green); font-size: 12px; min-height: 16px; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px; width: 380px; max-width: 100%; box-shadow: var(--shadowLg); }
  .login-card .brand { padding-right: 70px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .login-card p { color: var(--muted); margin: 0 0 20px; }
  .seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  [data-theme="dark"] .seg button.on { background: var(--chip); }
  .stack { display: flex; flex-direction: column; gap: 14px; }

  /* header */
  [data-theme="dark"] header { border-bottom: 1px solid var(--line); }
  header { background: var(--head); color: var(--headText); padding: 0 24px; min-height: 58px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  header .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header nav button { border: 0; background: none; color: var(--headMuted); padding: 8px 12px; border-radius: 7px; cursor: pointer; }
  header nav button.on, header nav button:hover { background: var(--head2); color: var(--headText); }
  header nav button .lock { font-size: 10px; opacity: .7; margin-left: 4px; }
  .kpis { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; }
  .kpi { display: flex; align-items: baseline; gap: 6px; background: none; border: 0; cursor: pointer; padding: 4px 2px; color: var(--headMuted); }
  .kpi b { font-family: "Space Grotesk", sans-serif; font-size: 18px; }
  .kpi:hover span { color: var(--headText); }
  .icon-btn { background: none; border: 0; color: var(--headMuted); cursor: pointer; height: 34px; min-width: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
  .icon-btn:hover { background: var(--head2); color: var(--headText); }
  .me { display: flex; align-items: center; gap: 8px; color: var(--headMuted); font-size: 12px; position: relative; }
  .me .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accentText); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .menu { position: absolute; right: 0; top: 40px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadowLg); min-width: 210px; padding: 6px; z-index: 20; }
  .menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu .who small { color: var(--muted); display: block; margin-top: 2px; text-transform: capitalize; }

  const CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycbz15CoqSRPv_c973XwyxylZYteo1WQWeBxHnjNbdSkpJcZdqb2XnUaMSczPAdKyVHpk/exec", // Apps Script web app URL ending in /exec  (empty = demo mode with sample data)
    AUTO_REFRESH_SEC: 60
  };
</script>
<!-- ================================ -->

<div id="login" class="hidden">
  <form class="login-card stack" id="loginForm" autocomplete="on">
    <button type="button" class="tswitch" id="loginTheme" title="Switch light / dark" aria-label="Switch between light and dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="knob"></span></button>
    <div>
      <div class="brand grot"><span class="logo" role="img" aria-label="YT4B"></span>YTB Edits Tracker</div>
      <p>Sign in to see who's working on what.</p>
    </div>
    <div class="seg" role="tablist" aria-label="Sign-in type">
      <button type="button" class="on" data-mode="team" role="tab">Team</button>
      <button type="button" data-mode="admin" role="tab">Admin / Owner</button>

    <div class="field" id="whoField"><label for="lwho">Your name</label><select class="input" id="lwho" autocomplete="off"><option value="">Loading names…</option></select></div>

    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="height:42px;justify-content:center">Sign in</button>

  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand grot"><span class="logo" role="img" aria-label="YT4B"></span>YTB Edits Tracker</div>
    <nav id="nav"></nav>
    <div class="kpis" id="kpis"></div>
    <button class="icon-btn" id="refreshBtn" title="Reload from the sheet" aria-label="Reload from the sheet">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="tswitch" id="themeBtn" title="Switch light / dark" aria-label="Switch between light and dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="knob"></span></button>
    <div class="me"><button class="icon-btn" id="meBtn" aria-label="Account menu"><span class="av" id="meAv"></span></button><div class="menu hidden" id="meMenu"></div></div>
  </header>
  <div class="demo hidden" id="demoBar">Demo mode: sample data, nothing is saved. Any password works; sign in with a name to see the owner pages.</div>
  <div class="toolbar hidden" id="toolbar"></div>
  <main id="view"><div class="loading">Loading…</div></main>
</div>
<div id="modalRoot"></div>

<script>
// ================================================================ state
const S = {
  token: "", me: null, editors: [], lists: {}, tasks: [], today: "", view: "board", demo: !CONFIG.API_URL,
  f: { q: "", format: "", editor: "", client: "", overdue: false, hideDone: true },
  sort: { key: "dueDate", dir: 1 }, modalOpen: false, anim: true, lastSync: null, users: null, qcKey: ""
};
const STATUS_DOT = { "Not started": "#94a3b8", "Scripting": "#0e7490", "Editing": "#f59e0b", "Internal review": "#8b5cf6", "Revisions": "#ea580c", "Client review": "#3b82f6", "Approved": "#22c55e", "Delivered": "#047857", "Uploaded": "#4f46e5", "On hold": "#a8a29e" };
const EXTRA_C = ["#db2777", "#65a30d", "#7c3aed", "#0891b2", "#b45309"];
const inkOn = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111827" : "#ffffff"; };
const stageColor = st => STATUS_DOT[st] || EXTRA_C[Math.abs([...String(st)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % EXTRA_C.length];
const PRI_C = { Urgent: "#dc2626", High: "#ea580c", Normal: "#2563eb", Low: "#16a34a" };
const FMT_C = { "Long Form": "#6366f1", "Short Form": "#db2777" };
const QC_C = { "Pending": "#d97706", "Passed": "#16a34a", "Failed – fixes needed": "#dc2626" };
const SHIFT_C = { "Full day": "#0284c7", "1st half": "#d97706", "2nd half": "#7c3aed" };
const SHIFTS = ["Full day", "1st half", "2nd half"];
const colorFor = (kind, v) => kind === "status" ? stageColor(v) : ((kind === "priority" ? PRI_C : kind === "format" ? FMT_C : kind === "shift" ? SHIFT_C : QC_C)[v] || "#6b7280");
const chip = (kind, v, label) => v ? `<span class="chip" style="--c:${colorFor(kind, v)}">${esc(label || v)}</span>` : "";
const STATUS_BG = { "Not started": "#e5e7eb", "Editing": "#fef0c7", "Internal review": "#ede9fe", "Revisions": "#ffedd5", "Client review": "#dbeafe", "Approved": "#d1fae5", "Delivered": "#a7f3d0", "On hold": "#d1d5db" };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const isAdmin = () => S.me && (S.me.role === "admin" || S.me.role === "owner");
const isOwner = () => S.me && S.me.role === "owner";
const isSuper = () => !!(S.me && S.me.super);
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : (p[0] || "?")[1] || "")).toUpperCase(); };

// ================================================================ theme
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".tswitch").forEach(b => b.setAttribute("aria-pressed", t === "dark" ? "true" : "false"));
}
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store.set("ytb_theme", t); applyTheme(t); }
applyTheme(store.get("ytb_theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#themeBtn").onclick = toggleTheme; $("#loginTheme").onclick = toggleTheme;

// ================================================================ dates + rules
function localISO(d) { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); }
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }
function dayDiff(a, b) { const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
const DONE = ["Delivered", "Uploaded"];
const isDone = t => DONE.includes(t.status);
const coList = t => String(t.coEditors || "").split(",").map(x => x.trim()).filter(x => x && x !== t.editor);
const editorsOf = t => [t.editor].concat(coList(t));
const worksOn = (t, ed) => editorsOf(t).includes(ed);
const isActive = t => !isDone(t) && t.status !== "On hold";
const isOverdue = t => !!t.dueDate && !isDone(t) && t.dueDate < S.today;
const isDueSoon = t => !!t.dueDate && !isDone(t) && t.dueDate >= S.today && t.dueDate <= addDays(S.today, 2);
const monthStart = () => S.today.slice(0, 8) + "01";
const deliveredThisMonth = t => isDone(t) && (t.deliveredDate || "") >= monthStart();
const qcFailed = t => t.qcResult === "Failed – fixes needed";
function dueTag(t) {
  if (!t.dueDate) return "";
  if (isDone(t)) return `<span class="tag ok">${esc(t.status)} ${fmtDate(t.deliveredDate)}</span>`;
  if (isOverdue(t)) return `<span class="tag late">${dayDiff(t.dueDate, S.today)}d late</span>`;
  if (t.dueDate === S.today) return `<span class="tag soon">Due today</span>`;
  if (isDueSoon(t)) return `<span class="tag soon">Due ${fmtDate(t.dueDate)}</span>`;
  return `<span class="tag plain">Due ${fmtDate(t.dueDate)}</span>`;
}
const fmtTag = f => f ? chip("format", f, f === "Short Form" ? "Short" : "Long") : "";
const leads = () => (S.lists.assigners || []).filter(a => !S.editors.includes(a));
// Everyone who can be put on a video: editors first, then team (pod) leads
const teamPeople = () => S.editors.concat(leads());
// Editors, plus any lead who is currently on a video
const peopleOnVideos = () => S.editors.concat(leads().filter(l => S.tasks.some(t => worksOn(t, l))));
const isLead = n => leads().includes(n);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';
function lateInfo(t) {
  if (!t.dueDate) return null;
  if (isOverdue(t)) return { n: dayDiff(t.dueDate, S.today), was: false };
  if (isDone(t) && t.deliveredDate && t.deliveredDate > t.dueDate) return { n: dayDiff(t.dueDate, t.deliveredDate), was: true };
  return null;
}
function lateLine(t) {
  const L = lateInfo(t); if (!L) return "";
  const txt = L.was ? `Delivered ${plural(L.n, "day")} after the deadline` : `Deadline missed by ${plural(L.n, "day")}`;
  return `<div class="lateline ${L.was ? "was" : ""}" title="Due ${fmtDate(t.dueDate)}">${WARN}${txt}</div>`;
}
const shiftTag = t => t.shift ? chip("shift", t.shift) : "";

// ================================================================ API
async function api(action, payload = {}) {
  if (S.demo) return Demo.handle(action, payload);
  const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: S.token, action, ...payload }) });
  const data = await res.json();
  if (!data.ok) { const e = new Error(data.error || "Request failed"); e.auth = data.auth === false; throw e; }
  return data;
}
async function load(silent) {
  try {
    const d = await api("getAll");
    S.editors = d.editors; S.lists = d.lists; S.tasks = d.tasks; S.today = d.today || localISO(new Date()); S.me = d.me || S.me;
    S.lastSync = new Date();
    if (!S.modalOpen && !(silent && document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName) && $("#app").contains(document.activeElement))) render();
    return true;
  } catch (e) {
    if (e.auth) { logout(true); $("#loginErr").textContent = "Your session ended. Please sign in again."; return false; }
    if (!silent) toast(e.message, true);
    return false;
  }
}

// ================================================================ login
let loginMode = "team";
document.querySelectorAll(".seg [data-mode]").forEach(b => b.onclick = () => {
  loginMode = b.dataset.mode;
  document.querySelectorAll(".seg [data-mode]").forEach(x => x.classList.toggle("on", x === b));
  $("#nameField").classList.toggle("hidden", loginMode === "team");
  $("#whoField").classList.toggle("hidden", loginMode !== "team");
  $("#pwLabel").textContent = loginMode === "team" ? "Team password" : "Your password";
  $("#loginErr").textContent = "";
  (loginMode === "team" ? $("#lwho") : $("#lname")).focus();
});
async function loadNames() {
  try {
    const r = await api("names");
    const last = store.get("ytb_who") || "";
    const o = n => `<option ${n === last ? "selected" : ""}>${esc(n)}</option>`;
    $("#lwho").innerHTML = `<option value="">Pick your name</option><optgroup label="Editors">${r.editors.map(o).join("")}</optgroup>`
      + ((r.leads || []).filter(l => !r.editors.includes(l)).length ? `<optgroup label="Pod leads">${r.leads.filter(l => !r.editors.includes(l)).map(o).join("")}</optgroup>` : "");
  } catch (e) { $("#lwho").innerHTML = `<option value="">Couldn't load names — refresh the page</option>`; }
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = loginMode === "admin" ? $("#lname").value.trim() : "";
  if (loginMode === "admin" && !name) { $("#loginErr").textContent = "Enter your name."; return; }
  const who = loginMode === "team" ? $("#lwho").value : "";
  if (loginMode === "team" && !who) { $("#loginErr").textContent = "Pick your name first."; return; }
  $("#loginErr").textContent = ""; $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Signing in…";
  try {
    const r = await api("login", loginMode === "team" ? { who, password: $("#lpw").value } : { name, password: $("#lpw").value });
    if (who) store.set("ytb_who", who);
    S.token = r.token; S.me = { name: r.name, role: r.role, super: !!r.super };
    store.set("ytb_token", r.token);
    $("#lpw").value = ""; $("#lpw").type = "password"; const eb = $("#lpw").parentNode.querySelector(".pw-eye"); if (eb) eb.innerHTML = EYE;
    S.view = isAdmin() ? "admin" : "board";
    if (await load()) showApp();
  } catch (err) { $("#loginErr").textContent = err.message === "Failed to fetch" ? "Can't reach the tracker right now." : err.message; }
  $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Sign in";
});
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); S.anim = true; render(); }
function logout(silent) {
  if (!silent && S.token && !S.demo) api("logout").catch(() => {});
  store.del("ytb_token"); S.token = ""; S.me = null; S.users = null;
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#meMenu").classList.add("hidden");
}

// ================================================================ header
$("#refreshBtn").onclick = async () => { if (await load()) toast("Up to date"); };
$("#meBtn").onclick = e => { e.stopPropagation(); $("#meMenu").classList.toggle("hidden"); };
document.addEventListener("click", e => { if (!$("#meMenu").contains(e.target)) $("#meMenu").classList.add("hidden"); });

function renderHeader() {
  const views = [["board", "Board"], ["table", "Table"]];
  if (isAdmin()) views.push(["admin", "Admin dashboard"], ["activity", "Activity"]);
  if (isOwner()) views.push(["access", "Access"]);
  if (isSuper()) views.push(["settings", "Settings"]);
  $("#nav").innerHTML = views.map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? "on" : ""}">${l}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.v));
  const T = S.tasks;
  const k = [[T.filter(isActive).length, "active", "#fff", "active"], [T.filter(isDueSoon).length, "due 48h", "#fdba74", "soon"],
    [T.filter(isOverdue).length, "overdue", "#fca5a5", "overdue"], [T.filter(deliveredThisMonth).length, "delivered this month", "#86efac", "delivered"],
    [T.filter(qcFailed).length, "QC failed", "#fca5a5", "qc"]];
  $("#kpis").innerHTML = k.map(([n, l, c, p]) => `<button class="kpi" data-p="${p}" title="${n} ${l}"><b style="color:${c}">${n}</b><span>${l}</span></button>`).join("");
  document.querySelector("header").classList.toggle("wide", views.length > 3);
  $("#kpis").querySelectorAll(".kpi").forEach(b => b.onclick = () => openPreset(b.dataset.p));
  $("#meAv").textContent = initials(S.me ? S.me.name : "?");
  $("#meMenu").innerHTML = `<div class="who"><b>${esc(S.me?.name)}</b><small>${esc(S.me?.role === "member" ? "Team member" : S.me?.super ? "Main owner" : S.me?.role)}</small></div>
    ${isAdmin() ? `<button id="mPw">Change my password</button>` : ""}
    <button id="mOut">Sign out</button>`;
  if ($("#mPw")) $("#mPw").onclick = () => { $("#meMenu").classList.add("hidden"); openPasswordModal(); };
  $("#mOut").onclick = () => logout();
  $("#demoBar").classList.toggle("hidden", !S.demo);
}

function openPreset(p) {
  S.f = { q: "", format: "", editor: "", client: "", overdue: p === "overdue", hideDone: p !== "delivered", preset: p };
  go("table", true);
}
function go(v, keepFilters) {
  if (((v === "admin" || v === "activity") && !isAdmin()) || (v === "access" && !isOwner()) || (v === "settings" && !isSuper())) v = "board";
  S.view = v;
  if (!keepFilters) S.f.preset = "";
  window.scrollTo(0, 0); S.anim = true; render();
  if (v === "access" && !S.users) loadUsers();
  if (v === "settings") loadSettings();
  if (v === "activity") loadActivity();
}

// ================================================================ render
function render() {
  if (!S.me) return;
  renderHeader();
  const view = $("#view");
  view.classList.remove("enter");
  if (S.anim) { void view.offsetWidth; view.classList.add("enter"); S.anim = false; }
  if (S.view === "admin") { $("#toolbar").classList.add("hidden"); return renderAdmin(); }
  if (S.view === "activity") { $("#toolbar").classList.add("hidden"); return renderActivity(); }
  if (S.view === "access") { $("#toolbar").classList.add("hidden"); return renderAccess(); }
  if (S.view === "settings") { $("#toolbar").classList.add("hidden"); return renderSettings(); }
  renderToolbar();
  if (S.view === "table") renderTable(); else renderBoard();
}

const PRESETS = { active: ["Active videos", isActive], soon: ["Due in the next 48 hours", isDueSoon], overdue: ["Overdue", isOverdue],
  review: ["In client review", t => t.status === "Client review"], delivered: ["Delivered this month", deliveredThisMonth], qc: ["QC failed", qcFailed] };

function filtered() {
  const f = S.f;
  let T = S.tasks.slice();
  if (f.preset && PRESETS[f.preset]) T = T.filter(PRESETS[f.preset][1]);
  if (f.format) T = T.filter(t => t.format === f.format);
  if (f.editor) T = T.filter(t => worksOn(t, f.editor));
  if (f.client) T = T.filter(t => t.client === f.client);
  if (f.overdue) T = T.filter(isOverdue);
  if (f.status) T = T.filter(t => t.status === f.status);
  if (f.q) { const q = f.q.toLowerCase(); T = T.filter(t => [t.title, t.client, t.format, t.blocker, editorsOf(t).join(" "), t.assignedBy].join(" ").toLowerCase().includes(q)); }
  return T;
}

function renderToolbar() {
  const f = S.f;
  const opt = (arr, v, label) => `<option value="">${label}</option>` + (arr || []).map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("");
  const segBtn = (v, l) => `<button type="button" data-fmt="${v}" class="${f.format === v ? "on" : ""}">${l}</button>`;
  const n = S.view === "table" ? filtered().filter(t => !(f.hideDone && isDone(t) && f.preset !== "delivered")).length : filtered().length;
  $("#toolbar").classList.remove("hidden");
  $("#toolbar").innerHTML = `
    <div class="seg" role="group" aria-label="Format">${segBtn("", "All")}${segBtn("Long Form", "Long Form")}${segBtn("Short Form", "Short Form")}</div>
    <select id="fEditor" aria-label="Editor">${opt(peopleOnVideos(), f.editor, `All editors (${S.editors.length})`)}</select>
    <select id="fClient" aria-label="Channel">${opt(S.lists.clients, f.client, `All channels (${(S.lists.clients || []).length})`)}</select>
    <input type="search" id="fq" placeholder="Search videos…" value="${esc(f.q)}" aria-label="Search">
    <button type="button" class="toggle red ${f.overdue ? "on" : ""}" id="fOver">Only overdue (${S.tasks.filter(isOverdue).length})</button>
    ${S.view === "table" ? `<button type="button" class="toggle ${f.hideDone ? "on" : ""}" id="fDone">Hide delivered</button>` : ""}
    ${f.preset && PRESETS[f.preset] ? `<button type="button" class="toggle on" id="fPreset">${PRESETS[f.preset][0]} ✕</button>` : ""}
    ${f.status ? `<button type="button" class="toggle on" id="fStatus">Stage: ${esc(f.status)} ✕</button>` : ""}
    <span class="spacer"></span><span class="count">${n} video${n === 1 ? "" : "s"}</span>
    <button class="btn primary" id="addBtn">+ Add video</button>`;
  $("#toolbar").querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => { S.f.format = b.dataset.fmt; S.anim = true; render(); });
  $("#fEditor").onchange = e => { S.f.editor = e.target.value; S.anim = true; render(); };
  $("#fClient").onchange = e => { S.f.client = e.target.value; S.anim = true; render(); };
  $("#fq").oninput = e => { S.f.q = e.target.value; render(); const i = $("#fq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $("#fOver").onclick = () => { S.f.overdue = !S.f.overdue; S.anim = true; render(); };
  if ($("#fDone")) $("#fDone").onclick = () => { S.f.hideDone = !S.f.hideDone; render(); };
  if ($("#fPreset")) $("#fPreset").onclick = () => { S.f.preset = ""; S.f.overdue = false; render(); };
  if ($("#fStatus")) $("#fStatus").onclick = () => { S.f.status = ""; render(); };
  $("#addBtn").onclick = () => openTaskModal(null);
}

// ---------------------------------------------------------------- board
function renderBoard() {
  const T = filtered();
  const statuses = (S.lists.status && S.lists.status.length ? S.lists.status : Object.keys(STATUS_DOT));
  const pri = { Urgent: 0, High: 1, Normal: 2, Low: 3 };
  const sortCards = a => a.sort((x, y) => (isOverdue(y) - isOverdue(x)) || ((pri[x.priority] ?? 2) - (pri[y.priority] ?? 2)) || String(x.dueDate || "9").localeCompare(String(y.dueDate || "9")));
  let ci = 0;
  $("#view").innerHTML = `<div class="board-wrap"><div class="board">${statuses.map(s => {
    let cards = T.filter(t => t.status === s);
    let note = "";
    if (DONE.includes(s)) { cards = cards.filter(deliveredThisMonth); note = "this month"; }
    cards = sortCards(cards);
    return `<section class="col" data-status="${esc(s)}" aria-label="${esc(s)}">
      <div class="col-h"><span class="cdot" style="background:${stageColor(s)}"></span><b>${esc(s)}</b><span class="n">${cards.length}</span>${note ? `<small>${note}</small>` : ""}</div>

function cardHTML(t, i) {

function bindBoard() {
  let dragKey = null;
  document.querySelectorAll(".card").forEach(c => {
    c.onclick = () => openTaskModal(findTask(c.dataset.key));
    c.ondragstart = e => { dragKey = c.dataset.key; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragKey); };
    c.ondragend = () => c.classList.remove("dragging");
  });
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop"); };
    col.ondragleave = e => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); };
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove("drop");
      const t = findTask(dragKey || e.dataTransfer.getData("text/plain"));
      if (t && t.status !== col.dataset.status) quickStatus(t, col.dataset.status);
    };
  });
}

  catch (e) { toast(e.message, true); }

function renderActivity() {
  if (!isAdmin()) return go("board");

  const items = S.activity || [];
  const whos = [...new Set(items.map(x => x.who).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const tabs = [...new Set(items.map(x => x.editor).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const srcKey = w => /^QC/.test(w) ? "QC" : w;
  let L = items.filter(x => (!A.who || x.who === A.who) && (!A.where || srcKey(x.where) === A.where) && (!A.editor || x.editor === A.editor));
  if (A.q) { const q = A.q.toLowerCase(); L = L.filter(x => [x.who, x.video, x.what, x.editor].join(" ").toLowerCase().includes(q)); }
  const opt = (arr, v, label) => `<option value="">${label}</option>` + arr.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("");
  const dayLabel = d => { if (d === S.today) return "Today"; if (d === addDays(S.today, -1)) return "Yesterday"; const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: y !== +S.today.slice(0, 4) ? "numeric" : undefined }); };
  let lastDay = "", html = "";
  L.slice(0, 400).forEach((x, i) => {

    html += `<div class="act" style="--i:${Math.min(i, 30)}"><span class="tm">${t12}</span><span class="av" title="${esc(x.who)}">${initials(x.who || "?")}</span>

      ${x.video || x.editor ? `<div class="meta">${x.video ? `<b style="color:var(--text);font-weight:600">${esc(x.video)}</b>` : ""}${x.editor ? `<span>· ${esc(x.editor)}'s tab</span>` : ""}</div>` : ""}
      <div class="what">${esc(x.what)}</div></div></div>`;
  });
  $("#view").innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap"><h1 class="grot" style="margin:0;font-size:22px">Activity</h1>

    <div class="panel">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)">

        <select class="input" id="awho" style="max-width:220px" aria-label="Person">${opt(whos, A.who, "Everyone")}</select>
        <select class="input" id="aed" style="max-width:200px" aria-label="Editor tab">${opt(tabs, A.editor, "All editor tabs")}</select>
        <div class="seg" role="group" aria-label="Where">${[["", "All"], ["Website", "Website"], ["Sheet", "Sheet"], ["QC", "QC tool"]].map(([v, l]) => `<button type="button" data-aw="${v}" class="${A.where === v ? "on" : ""}">${l}</button>`).join("")}</div>
        <span class="spacer" style="flex:1"></span><span class="count">${L.length} change${L.length === 1 ? "" : "s"}${S.actTotal > items.length ? ` · latest ${items.length} of ${S.actTotal} loaded` : ""}</span>
      </div>
      ${S.activity ? (L.length ? html + (L.length > 400 ? `<div class="pad note">Showing the newest 400. Narrow the filters to see older ones, or open the Activity tab in the Google Sheet.</div>` : "") : `<div class="pad note">No changes match these filters.</div>`) : `<div class="loading">Loading…</div>`}
      <div class="pad note" style="border-top:1px solid var(--line2)">Edits typed straight into the Google Sheet show the person's Google email. Google hides it when the person isn't in your Google Workspace; then it says “Google hid the name”, and the sheet's own version history (File → Version history) is the backup.</div>
    </div>`;
  $("#actReload").onclick = loadActivity;
  $("#aq").oninput = e => { A.q = e.target.value; renderActivity(); const i = $("#aq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $("#awho").onchange = e => { A.who = e.target.value; renderActivity(); };
  $("#aed").onchange = e => { A.editor = e.target.value; renderActivity(); };
  document.querySelectorAll("[data-aw]").forEach(b => b.onclick = () => { A.where = b.dataset.aw; renderActivity(); });
}

    if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = "Click to confirm"; return; }
    try { const r = await api("removeUser", { user: name }); S.users = r.users; toast("Removed " + name); renderAccess(); } catch (e) { toast(e.message, true); }

}

// ---------------------------------------------------------------- task modal
function findTask(key) { const [ed, row] = String(key).split("|"); return S.tasks.find(t => t.editor === ed && String(t.row) === row); }
function formatsFor(channel, current) {
  const all = S.lists.formats || ["Long Form", "Short Form"];
  const map = (S.lists.channelFormats || []).filter(m => m.channel === channel).map(m => m.format);
  const out = map.length ? all.filter(f => map.includes(f)).concat(map.filter(f => !all.includes(f))) : all.slice();
  if (current && !out.includes(current)) out.push(current);
  return out;
}
// ---------------------------------------------------------------- required fields
const REQ = [["title", "Video title"], ["editor", "Main editor"], ["client", "Channel"], ["format", "Format"], ["assignedBy", "Assigned by"],
  ["shift", "Day slot"], ["assignedDate", "Assigned date"], ["dueDate", "Due date"]];
const AFTER_DRAFT = ["Internal review", "Revisions", "Client review", "Approved", "Delivered", "Uploaded"];
// returns [[field, label], …] that are missing for this video at its stage
function missingFields(t) {
  const m = REQ.filter(([k]) => !String(t[k] ?? "").trim());
  if (AFTER_DRAFT.includes(t.status) && !t.firstDraftDate) m.push(["firstDraftDate", "First draft date (needed from Internal review on)"]);
  if (DONE.includes(t.status) && !t.deliveredDate) m.push(["deliveredDate", "Delivered date"]);
  return m;
}
async function quickStatus(t, status) {
  const task = { ...t, status };
  if (DONE.includes(status) && !t.deliveredDate) task.deliveredDate = S.today;
  if (AFTER_DRAFT.includes(status) && !t.firstDraftDate) task.firstDraftDate = S.today;
  if (missingFields(task).length) { toast("Fill in the required fields first", true); return openTaskModal(t, { status }); }
  const prev = { status: t.status, deliveredDate: t.deliveredDate, firstDraftDate: t.firstDraftDate };
  Object.assign(t, task); render();
  try { await api("update", { editor: t.editor, row: t.row, orig: t.title, task }); toast(`Moved to ${status}`); load(true); }
  catch (e) { Object.assign(t, prev); render(); toast(e.message, true); }
}

let toastTimer;
function toast(msg, bad) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2800);
}

// ================================================================ show / hide password (eye icon on every password box)
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addEyes(root) {
  (root || document).querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = "1";
    const wrap = document.createElement("span"); wrap.className = "pw-wrap";
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const b = document.createElement("button");
    b.type = "button"; b.className = "pw-eye"; b.innerHTML = EYE;
    b.setAttribute("aria-label", "Show password"); b.title = "Show password";
    b.onclick = () => {
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      b.innerHTML = show ? EYE_OFF : EYE;
      b.setAttribute("aria-label", show ? "Hide password" : "Show password"); b.title = show ? "Hide password" : "Show password";
      inp.focus(); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (e) {}
    };
    wrap.appendChild(b);
  });
}
addEyes();
new MutationObserver(() => addEyes()).observe(document.body, { childList: true, subtree: true });
