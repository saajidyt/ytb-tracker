<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTB Edits Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f6; --surface: #ffffff; --surface2: #f9fafb; --line: #e5e7eb; --line2: #f0f1f3;
    --text: #111827; --text2: #374151; --muted: #6b7280;
    --head: #111827; --head2: #1f2937; --headText: #ffffff; --headMuted: #d1d5db;
    --accent: #ea580c; --accentText: #ffffff; --accentSoft: #fff1e8;
    --red: #b91c1c; --redBg: #fee2e2; --orange: #c2410c; --orangeBg: #ffedd5; --green: #047857; --greenBg: #d1fae5;
    --longBg: #eef2ff; --longText: #4338ca; --shortBg: #fdf2f8; --shortText: #be185d;
    --chip: #e5e7eb; --shadow: 0 1px 2px rgba(17,24,39,.05); --shadowLg: 0 20px 50px rgba(0,0,0,.18);
    --overlay: rgba(17,24,39,.45);
  }
  [data-theme="dark"] {
    --bg: #0d0f14; --surface: #151922; --surface2: #1a1f2a; --line: #262c39; --line2: #1f2430;
    --text: #e8eaf0; --text2: #c7ccd8; --muted: #9aa3b5;
    --head: #0a0c10; --head2: #1a1f2a; --headText: #ffffff; --headMuted: #aab2c3;
    --accent: #fb7a3c; --accentText: #140a04; --accentSoft: #2a1a10;
    --red: #ff8a8a; --redBg: #3a1717; --orange: #ffb27a; --orangeBg: #3a2414; --green: #6ee7b7; --greenBg: #10322a;
    --longBg: #1e2340; --longText: #aab4ff; --shortBg: #3a1730; --shortText: #ff9fd2;
    --chip: #262c39; --shadow: none; --shadowLg: 0 20px 50px rgba(0,0,0,.6);
    --overlay: rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 13px; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .grot { font-family: "Space Grotesk", Inter, sans-serif; }

  /* buttons + inputs */
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accentText); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--red); }
  .btn.danger.confirm { background: var(--red); border-color: var(--red); color: var(--surface); }
  .btn.small { height: 30px; padding: 0 10px; font-size: 12px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .input { height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
  .input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .err { color: var(--red); font-size: 12px; min-height: 16px; }
  .ok-msg { color: var(--green); font-size: 12px; min-height: 16px; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px; width: 380px; max-width: 100%; box-shadow: var(--shadowLg); }
  .login-card .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .login-card p { color: var(--muted); margin: 0 0 20px; }
  .seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  [data-theme="dark"] .seg button.on { background: var(--chip); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block; }

  /* header */
  header { background: var(--head); color: var(--headText); padding: 0 24px; min-height: 58px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  header .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header nav button { border: 0; background: none; color: var(--headMuted); padding: 8px 12px; border-radius: 7px; cursor: pointer; }
  header nav button.on, header nav button:hover { background: var(--head2); color: var(--headText); }
  header nav button .lock { font-size: 10px; opacity: .7; margin-left: 4px; }
  .kpis { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; }
  .kpi { display: flex; align-items: baseline; gap: 6px; background: none; border: 0; cursor: pointer; padding: 4px 2px; color: var(--headMuted); }
  .kpi b { font-family: "Space Grotesk", sans-serif; font-size: 18px; }
  .kpi:hover span { color: var(--headText); }
  .icon-btn { background: none; border: 0; color: var(--headMuted); cursor: pointer; height: 34px; min-width: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
  .icon-btn:hover { background: var(--head2); color: var(--headText); }
  .me { display: flex; align-items: center; gap: 8px; color: var(--headMuted); font-size: 12px; position: relative; }
  .me .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accentText); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .menu { position: absolute; right: 0; top: 40px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadowLg); min-width: 210px; padding: 6px; z-index: 20; }
  .menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .menu .who small { color: var(--muted); display: block; margin-top: 2px; text-transform: capitalize; }
  .menu button { width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--surface2); }
  .demo { background: #fef0c7; color: #93370d; text-align: center; padding: 6px; font-size: 12px; }

  /* toolbar */
  .toolbar { padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--surface); }
  .toolbar select, .toolbar input[type=search] { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px; }
  .toolbar input[type=search] { width: 220px; }
  .toggle { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; white-space: nowrap; }
  .toggle.on.red { background: var(--redBg); border-color: transparent; color: var(--red); font-weight: 600; }
  .toggle.on { background: var(--accentSoft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .spacer { flex: 1; }
  .count { color: var(--muted); font-size: 12px; }

  main { padding: 20px 24px 60px; }

  /* board */
  .board-wrap { overflow-x: auto; padding-bottom: 6px; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; min-width: min-content; }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 200px; border-radius: 12px; padding: 4px; transition: background .12s; }
  .col.drop { background: var(--accentSoft); outline: 2px dashed var(--accent); outline-offset: -2px; }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; }
  .col-h .cdot { width: 8px; height: 8px; border-radius: 50%; }
  .col-h b { font-family: "Space Grotesk", sans-serif; font-size: 14px; font-weight: 600; }
  .col-h .n { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); background: var(--chip); padding: 1px 7px; border-radius: 999px; }
  .col-h small { color: var(--muted); font-size: 11px; margin-left: auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); cursor: grab; text-align: left; width: 100%; }
  .card:hover { border-color: var(--muted); }
  .card.dragging { opacity: .45; }
  .card .top { display: flex; align-items: center; gap: 6px; }
  .card .t { font-weight: 600; font-size: 13.5px; line-height: 1.35; }
  .card .ch { font-size: 12px; color: var(--text2); }
  .card .foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line2); padding-top: 8px; }
  .av { width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--surface); font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .tag.long { background: var(--longBg); color: var(--longText); }
  .tag.short { background: var(--shortBg); color: var(--shortText); }
  .tag.late { background: var(--redBg); color: var(--red); }
  .tag.soon { background: var(--orangeBg); color: var(--orange); }
  .tag.plain { background: var(--chip); color: var(--text2); }
  .tag.ok { background: var(--greenBg); color: var(--green); }
  .pri-Urgent { color: var(--red); font-weight: 700; } .pri-High { color: var(--orange); font-weight: 700; }
  .qcflag { font-size: 11px; font-weight: 600; color: var(--red); background: var(--redBg); border-radius: 5px; padding: 4px 7px; }
  .empty-col { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); font-size: 12px; }

  /* panels + tables */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-weight: 600; flex-wrap: wrap; }
  .panel-h small { color: var(--muted); font-weight: 400; }
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; padding: 10px 12px; background: var(--surface2); border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line2); white-space: nowrap; vertical-align: middle; }
  td.wrap { white-space: normal; min-width: 220px; }
  td.num, th.num { text-align: right; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface2); }
  tr.overdue td { background: color-mix(in srgb, var(--redBg) 45%, transparent); }
  tr.done td { color: var(--muted); }
  select.status { border: 0; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 500; cursor: pointer; color: #111827; }
  .zero { color: var(--muted); opacity: .6; }

  /* admin dashboard */
  .grid-kpi { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .bigkpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; }
  .bigkpi:hover { border-color: var(--muted); }
  .bigkpi .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .bigkpi .n { font-family: "Space Grotesk", sans-serif; font-size: 32px; font-weight: 700; margin-top: 6px; }
  .bigkpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .two { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; margin-top: 18px; }
  .two > .main { flex: 2 1 600px; min-width: 0; } .two > .side { flex: 1 1 320px; min-width: 0; }
  .sbar { display: flex; gap: 3px; height: 10px; margin: 16px 18px 10px; }
  .sbar div { border-radius: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0 18px 16px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .load { width: 120px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .load > div { height: 6px; background: var(--accent); border-radius: 3px; }
  .att { padding: 12px 18px; border-top: 1px solid var(--line2); cursor: pointer; }
  .att:hover { background: var(--surface2); }
  .att .row1 { display: flex; gap: 10px; align-items: baseline; }
  .att .row1 b { flex: 1; font-weight: 600; }
  .att .row2 { display: flex; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 4px; flex-wrap: wrap; align-items: center; }

  /* access page */
  .access { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .access .full { grid-column: 1 / -1; }
  .pad { padding: 18px; }
  .row-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row-form .field { flex: 1 1 160px; }
  .role { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: capitalize; }
  .role.owner { background: var(--accentSoft); color: var(--accent); } .role.admin { background: var(--longBg); color: var(--longText); }
  .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .keybox { display: flex; gap: 8px; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .keybox code { flex: 1; font-family: "JetBrains Mono", monospace; font-size: 12px; overflow-wrap: anywhere; }
  .locked { max-width: 460px; margin: 60px auto; text-align: center; color: var(--muted); }

  /* modal */
  .backdrop { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 30; padding: 16px; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 760px; max-width: 100%; max-height: 92vh; overflow: auto; box-shadow: var(--shadowLg); }
  .modal.sm { width: 420px; }
  .modal-h { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .modal-h h3 { margin: 0; font-size: 17px; flex: 1; font-family: "Space Grotesk", sans-serif; }
  .x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); }
  .form { padding: 18px 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; }
  .form .w2 { grid-column: span 2; } .form .w4 { grid-column: span 4; }
  .form .sec { grid-column: span 4; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; border-top: 1px solid var(--line); padding-top: 14px; }
  .form .sec small { text-transform: none; font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .modal-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 10px 18px; border-radius: 9px; z-index: 40; box-shadow: var(--shadowLg); }
  .toast.bad { background: var(--red); color: #fff; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
  @media (max-width: 1100px) { .grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); } .access { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form .w4, .form .sec { grid-column: span 2; } .kpis { display: none; } }
</style>
</head>
<body>

<!-- ============ CONFIG ============ -->
<script>
  const CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycbz15CoqSRPv_c973XwyxylZYteo1WQWeBxHnjNbdSkpJcZdqb2XnUaMSczPAdKyVHpk/exec", // Apps Script web app URL ending in /exec  (empty = demo mode with sample data)
    AUTO_REFRESH_SEC: 60
  };
</script>
<!-- ================================ -->

<div id="login" class="hidden">
  <form class="login-card stack" id="loginForm" autocomplete="on">
    <div>
      <div class="brand grot"><span class="dot"></span>YTB Edits Tracker</div>
      <p>Sign in to see who's working on what.</p>
    </div>
    <div class="seg" role="tablist" aria-label="Sign-in type">
      <button type="button" class="on" data-mode="team" role="tab">Team</button>
      <button type="button" data-mode="admin" role="tab">Admin / Owner</button>
    </div>
    <div class="field hidden" id="nameField"><label for="lname">Your name</label><input class="input" id="lname" autocomplete="username" placeholder="e.g. Saajid"></div>
    <div class="field"><label for="lpw" id="pwLabel">Team password</label><input class="input" type="password" id="lpw" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="height:42px;justify-content:center">Sign in</button>
    <button type="button" class="btn small" id="loginTheme" style="align-self:center;border:0;background:none;color:var(--muted)">Switch to dark mode</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand grot"><span class="dot"></span>YTB Edits Tracker</div>
    <nav id="nav"></nav>
    <div class="kpis" id="kpis"></div>
    <button class="icon-btn" id="refreshBtn" title="Reload from the sheet" aria-label="Reload from the sheet">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
    <div class="me"><button class="icon-btn" id="meBtn" aria-label="Account menu"><span class="av" id="meAv"></span></button><div class="menu hidden" id="meMenu"></div></div>
  </header>
  <div class="demo hidden" id="demoBar">Demo mode: sample data, nothing is saved. Any password works; sign in with a name to see the owner pages.</div>
  <div class="toolbar hidden" id="toolbar"></div>
  <main id="view"><div class="loading">Loading…</div></main>
</div>
<div id="modalRoot"></div>

<script>
// ================================================================ state
const S = {
  token: "", me: null, editors: [], lists: {}, tasks: [], today: "", view: "board", demo: !CONFIG.API_URL,
  f: { q: "", format: "", editor: "", client: "", overdue: false, hideDone: true },
  sort: { key: "dueDate", dir: 1 }, modalOpen: false, lastSync: null, users: null, qcKey: ""
};
const STATUS_DOT = { "Not started": "#9ca3af", "Editing": "#f59e0b", "Internal review": "#8b5cf6", "Revisions": "#f97316", "Client review": "#3b82f6", "Approved": "#10b981", "Delivered": "#059669", "On hold": "#6b7280" };
const STATUS_BG = { "Not started": "#e5e7eb", "Editing": "#fef0c7", "Internal review": "#ede9fe", "Revisions": "#ffedd5", "Client review": "#dbeafe", "Approved": "#d1fae5", "Delivered": "#a7f3d0", "On hold": "#d1d5db" };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const isAdmin = () => S.me && (S.me.role === "admin" || S.me.role === "owner");
const isOwner = () => S.me && S.me.role === "owner";
const initials = n => { const p = String(n).trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : (p[0] || "?")[1] || "")).toUpperCase(); };

// ================================================================ theme
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  $("#themeBtn").innerHTML = t === "dark" ? sun : moon;
  $("#loginTheme").textContent = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
}
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; store.set("ytb_theme", t); applyTheme(t); }
applyTheme(store.get("ytb_theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#themeBtn").onclick = toggleTheme; $("#loginTheme").onclick = toggleTheme;

// ================================================================ dates + rules
function localISO(d) { const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); }
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }); }
function dayDiff(a, b) { const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
const isDone = t => t.status === "Delivered";
const isActive = t => !isDone(t) && t.status !== "On hold";
const isOverdue = t => !!t.dueDate && !isDone(t) && t.dueDate < S.today;
const isDueSoon = t => !!t.dueDate && !isDone(t) && t.dueDate >= S.today && t.dueDate <= addDays(S.today, 2);
const monthStart = () => S.today.slice(0, 8) + "01";
const deliveredThisMonth = t => isDone(t) && (t.deliveredDate || "") >= monthStart();
const qcFailed = t => t.qcResult === "Failed – fixes needed";
function dueTag(t) {
  if (!t.dueDate) return "";
  if (isDone(t)) return `<span class="tag ok">Delivered ${fmtDate(t.deliveredDate)}</span>`;
  if (isOverdue(t)) return `<span class="tag late">${dayDiff(t.dueDate, S.today)}d late</span>`;
  if (t.dueDate === S.today) return `<span class="tag soon">Due today</span>`;
  if (isDueSoon(t)) return `<span class="tag soon">Due ${fmtDate(t.dueDate)}</span>`;
  return `<span class="tag plain">Due ${fmtDate(t.dueDate)}</span>`;
}
const fmtTag = f => f ? `<span class="tag ${f === "Short Form" ? "short" : "long"}">${f === "Short Form" ? "Short" : "Long"}</span>` : "";

// ================================================================ API
async function api(action, payload = {}) {
  if (S.demo) return Demo.handle(action, payload);
  const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: S.token, action, ...payload }) });
  const data = await res.json();
  if (!data.ok) { const e = new Error(data.error || "Request failed"); e.auth = data.auth === false; throw e; }
  return data;
}
async function load(silent) {
  try {
    const d = await api("getAll");
    S.editors = d.editors; S.lists = d.lists; S.tasks = d.tasks; S.today = d.today || localISO(new Date()); S.me = d.me || S.me;
    S.lastSync = new Date();
    if (!S.modalOpen && !(silent && document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName) && $("#app").contains(document.activeElement))) render();
    return true;
  } catch (e) {
    if (e.auth) { logout(true); $("#loginErr").textContent = "Your session ended. Please sign in again."; return false; }
    if (!silent) toast(e.message, true);
    return false;
  }
}

function openPreset(p) {
  S.f = { q: "", format: "", editor: "", client: "", overdue: p === "overdue", hideDone: p !== "delivered", preset: p };
  go("table", true);
}
function go(v, keepFilters) {
  if ((v === "admin" && !isAdmin()) || (v === "access" && !isOwner())) v = "board";
  S.view = v;

// ================================================================ render
function render() {
  if (!S.me) return;
  renderHeader();
  if (S.view === "admin") { $("#toolbar").classList.add("hidden"); return renderAdmin(); }
  if (S.view === "access") { $("#toolbar").classList.add("hidden"); return renderAccess(); }
  renderToolbar();
  if (S.view === "table") renderTable(); else renderBoard();
}

const PRESETS = { active: ["Active videos", isActive], soon: ["Due in the next 48 hours", isDueSoon], overdue: ["Overdue", isOverdue],
  review: ["In client review", t => t.status === "Client review"], delivered: ["Delivered this month", deliveredThisMonth], qc: ["QC failed", qcFailed] };

function filtered() {
  const f = S.f;
  let T = S.tasks.slice();
  if (f.preset && PRESETS[f.preset]) T = T.filter(PRESETS[f.preset][1]);
  if (f.format) T = T.filter(t => t.format === f.format);
  if (f.editor) T = T.filter(t => t.editor === f.editor);
  if (f.client) T = T.filter(t => t.client === f.client);
  if (f.overdue) T = T.filter(isOverdue);
  if (f.q) { const q = f.q.toLowerCase(); T = T.filter(t => [t.title, t.client, t.format, t.blocker, t.editor, t.assignedBy].join(" ").toLowerCase().includes(q)); }
  return T;
}

    ${f.preset && PRESETS[f.preset] ? `<button type="button" class="toggle on" id="fPreset">${PRESETS[f.preset][0]} ✕</button>` : ""}
    <span class="spacer"></span><span class="count">${n} video${n === 1 ? "" : "s"}</span>

  $("#fEditor").onchange = e => { S.f.editor = e.target.value; render(); };

// ---------------------------------------------------------------- board
function renderBoard() {
  const T = filtered();
  const statuses = (S.lists.status && S.lists.status.length ? S.lists.status : Object.keys(STATUS_DOT));
  const pri = { Urgent: 0, High: 1, Normal: 2, Low: 3 };
  const sortCards = a => a.sort((x, y) => (isOverdue(y) - isOverdue(x)) || ((pri[x.priority] ?? 2) - (pri[y.priority] ?? 2)) || String(x.dueDate || "9").localeCompare(String(y.dueDate || "9")));
  $("#view").innerHTML = `<div class="board-wrap"><div class="board">${statuses.map(s => {
    let cards = T.filter(t => t.status === s);
    let note = "";
    if (s === "Delivered") { cards = cards.filter(deliveredThisMonth); note = "this month"; }
    cards = sortCards(cards);
    return `<section class="col" data-status="${esc(s)}" aria-label="${esc(s)}">
      <div class="col-h"><span class="cdot" style="background:${STATUS_DOT[s] || "#9ca3af"}"></span><b>${esc(s)}</b><span class="n">${cards.length}</span>${note ? `<small>${note}</small>` : ""}</div>
      ${cards.length ? cards.map(cardHTML).join("") : `<div class="empty-col">Drop a video here</div>`}
    </section>`;
  }).join("")}</div></div>`;
  // no status
  const loose = T.filter(t => !t.status || !statuses.includes(t.status));
  if (loose.length) $("#view").insertAdjacentHTML("afterbegin", `<div class="note" style="margin-bottom:10px">${loose.length} video(s) have no status yet — open them from the Table view to set one.</div>`);
  bindBoard();
}
function cardHTML(t) {
  return `<button class="card" draggable="true" data-key="${esc(t.editor)}|${t.row}">
    <div class="top">${fmtTag(t.format)}${t.priority === "Urgent" || t.priority === "High" ? `<span class="pri-${t.priority}" style="font-size:11px">${t.priority}</span>` : ""}
      ${Number(t.revisions) ? `<span class="tag plain" title="Revisions" style="margin-left:auto">R${esc(t.revisions)}</span>` : ""}</div>
    <div class="t">${esc(t.title)}</div>
    <div class="ch">${esc(t.client || "No channel")}</div>
    ${t.blocker ? `<div class="note">⏸ ${esc(t.blocker)}</div>` : ""}
    <div class="foot"><span class="av" title="${esc(t.editor)}">${initials(t.editor)}</span><span style="font-size:12px;color:var(--text2)">${esc(t.editor)}</span><span style="margin-left:auto">${dueTag(t)}</span></div>
    ${qcFailed(t) ? `<div class="qcflag">QC failed: fixes needed</div>` : ""}
  </button>`;
}
function bindBoard() {
  let dragKey = null;
  document.querySelectorAll(".card").forEach(c => {
    c.onclick = () => openTaskModal(findTask(c.dataset.key));
    c.ondragstart = e => { dragKey = c.dataset.key; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragKey); };
    c.ondragend = () => c.classList.remove("dragging");
  });
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop"); };
    col.ondragleave = e => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); };
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove("drop");
      const t = findTask(dragKey || e.dataTransfer.getData("text/plain"));
      if (t && t.status !== col.dataset.status) quickStatus(t, col.dataset.status);
    };
  });
}

// ---------------------------------------------------------------- table

  let T = filtered();
  if (f.hideDone && f.preset !== "delivered") T = T.filter(t => !isDone(t));
  const { key, dir } = S.sort; const pri = { Urgent: 0, High: 1, Normal: 2, Low: 3 };
  T.sort((a, b) => { let x = a[key] ?? "", y = b[key] ?? ""; if (key === "priority") { x = pri[x] ?? 9; y = pri[y] ?? 9; } if (key === "revisions") { x = +x || 0; y = +y || 0; }
    if (x === "" && y !== "") return 1; if (y === "" && x !== "") return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const cols = [["title", "Video"], ["editor", "Editor"], ["client", "Channel"], ["format", "Format"], ["assignedBy", "Assigned by"], ["priority", "Priority"],
    ["assignedDate", "Assigned"], ["dueDate", "Due"], ["firstDraftDate", "First draft"], ["deliveredDate", "Delivered"], ["status", "Status"], ["revisions", "Rev."],
    ["blocker", "Blocker"], ["finalLink", "Final file"], ["qcResult", "QC"], ["qcReport", "QC report"]];

  $("#view").innerHTML = `<div class="panel">${T.length ? `<div class="tbl-wrap"><table>
    <thead><tr>${cols.map(([k, l]) => `<th data-sort="${k}" class="${k === "revisions" ? "num" : ""}">${l}${arrow(k)}</th>`).join("")}</tr></thead>
    <tbody>${T.map(t => `<tr class="click ${isOverdue(t) ? "overdue" : ""} ${isDone(t) ? "done" : ""}" data-key="${esc(t.editor)}|${t.row}">
      <td class="wrap"><b style="font-weight:600">${esc(t.title)}</b></td><td>${esc(t.editor)}</td><td>${esc(t.client)}</td><td>${fmtTag(t.format)}</td><td>${esc(t.assignedBy)}</td>
      <td class="pri-${esc(t.priority)}">${esc(t.priority)}</td><td>${fmtDate(t.assignedDate)}</td><td>${fmtDate(t.dueDate)} ${isOverdue(t) || isDueSoon(t) ? dueTag(t) : ""}</td>
      <td>${fmtDate(t.firstDraftDate)}</td><td>${fmtDate(t.deliveredDate)}</td>
      <td onclick="event.stopPropagation()"><select class="status" aria-label="Status" data-key="${esc(t.editor)}|${t.row}" style="background:${STATUS_BG[t.status] || "#e5e7eb"}">
        ${(S.lists.status || []).map(s => `<option ${s === t.status ? "selected" : ""}>${esc(s)}</option>`).join("")}${t.status ? "" : `<option selected value="">—</option>`}</select></td>
      <td class="num">${esc(t.revisions)}</td><td class="wrap note">${esc(t.blocker)}</td><td>${link(t.finalLink, "Open ↗")}</td>
      <td>${t.qcResult ? `<span class="tag ${t.qcResult === "Passed" ? "ok" : qcFailed(t) ? "late" : "plain"}">${esc(t.qcResult)}</span>` : ""}</td><td>${link(t.qcReport, "Report ↗")}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="loading">No videos match these filters.</div>`}</div>`;
  document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => { const k = th.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; renderTable(); });
  document.querySelectorAll("tr[data-key]").forEach(tr => tr.onclick = () => openTaskModal(findTask(tr.dataset.key)));
  document.querySelectorAll("select.status").forEach(sel => sel.onchange = () => quickStatus(findTask(sel.dataset.key), sel.value));
}

function findTask(key) { const [ed, row] = String(key).split("|"); return S.tasks.find(t => t.editor === ed && String(t.row) === row); }
function formatsFor(channel, current) {
  const all = S.lists.formats || ["Long Form", "Short Form"];
  const map = (S.lists.channelFormats || []).filter(m => m.channel === channel).map(m => m.format);
  const out = map.length ? all.filter(f => map.includes(f)).concat(map.filter(f => !all.includes(f))) : all.slice();
  if (current && !out.includes(current)) out.push(current);
  return out;
}
async function quickStatus(t, status) {
  const task = { ...t, status };
  if (status === "Delivered" && !t.deliveredDate) task.deliveredDate = S.today;
  const prev = { status: t.status, deliveredDate: t.deliveredDate };
  Object.assign(t, task); render();
  try { await api("update", { editor: t.editor, row: t.row, orig: t.title, task }); toast(`Moved to ${status}`); load(true); }
  catch (e) { Object.assign(t, prev); render(); toast(e.message, true); }
}

    if (action === "rotateQcKey") { qcKey = "qc-demo" + Math.random().toString(36).slice(2, 14); return { ok: true, qcKey }; }
    const i = tasks.findIndex(t => t.editor === p.editor && t.row === p.row); if (i < 0) throw new Error("Not found");
    if (action === "delete") { tasks.splice(i, 1); return { ok: true }; }
    if (action === "update") { if (p.newEditor && p.newEditor !== p.editor) { tasks.splice(i, 1); tasks.push({ ...p.task, editor: p.newEditor, row: nextRow(p.newEditor) }); } else Object.assign(tasks[i], p.task); return { ok: true }; }
    throw new Error("Unknown action");
  } };
})();

// ================================================================ start
(async function start() {
  const saved = store.get("ytb_token");
  if (saved && !S.demo) { S.token = saved; if (await load(true)) { S.view = isAdmin() ? "admin" : "board"; showApp(); } else $("#login").classList.remove("hidden"); }
  else $("#login").classList.remove("hidden");
  setInterval(() => { if (S.token && !S.modalOpen && !$("#app").classList.contains("hidden")) load(true); }, CONFIG.AUTO_REFRESH_SEC * 1000);
})();
</script>
