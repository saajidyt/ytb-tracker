function openOwnPw(email, fromLogin, firstTime) {
  const root = document.createElement("div");
  const changing = !fromLogin && S.me && S.me.ownPw;
  root.innerHTML = `<div class="backdrop"><div class="modal sm" role="dialog" aria-label="Set your password"><div class="modal-h"><h3>${changing ? "Change my password" : firstTime ? "Welcome! Let's set you up" : "Set your own password"}</h3><button class="x" aria-label="Close">×</button></div>
    <div class="tm-body" id="opBody"></div>
    <div class="modal-f"><span class="err" id="opE" style="flex:1"></span><button class="btn" data-c>Cancel</button><button class="btn primary" id="opGo"></button></div></div></div>`;
  document.body.appendChild(root);
  const q = sel => root.querySelector(sel);
  const close = () => root.remove();
  q(".x").onclick = close; q("[data-c]").onclick = close;
  const busy = (on, label) => { q("#opGo").disabled = on; q("#opGo").textContent = label; };
  let step = 1, saved = null;
  const stepOne = () => {
    step = 1;
    q("#opBody").innerHTML = fromLogin
      ? `<div class="note" style="margin-bottom:10px">${firstTime ? "First time here? " : ""}We'll email a 6-digit code to your work email. Use it to set a password only you know.</div>
         <div class="field"><label for="opEm">Work email</label><input class="input" type="email" id="opEm" value="${esc(email || "")}" autocomplete="username"></div>`
      : `<div class="note">We'll email a 6-digit code to <b>${esc(email)}</b>. Use it to set a password only you know. After that, the shared ${S.me && S.me.account ? "" : "role "}password stops working for you.</div>`;
    busy(false, "Email me a code"); q("#opE").textContent = "";
    setTimeout(() => (q("#opEm") || q("#opGo")).focus(), 30);
  };
  const stepTwo = () => {
    step = 2;
    q("#opBody").innerHTML = `<div class="note" style="margin-bottom:10px">Code sent to <b>${esc(email)}</b>. It works for 15 minutes. Check spam if you don't see it.</div>
      <div class="field"><label for="opCode">6-digit code</label><input class="input codein" id="opCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
      <div class="field"><label for="opP1">New password <small>(8+ characters)</small></label><input class="input" type="password" id="opP1" autocomplete="new-password"></div>
      <div class="field"><label for="opP2">Type it again</label><input class="input" type="password" id="opP2" autocomplete="new-password"></div>
      <button type="button" class="linkbtn" id="opResend" style="font-size:12px">Send a new code</button>`;
    q("#opResend").onclick = () => send();
    busy(false, "Save password"); setTimeout(() => q("#opCode").focus(), 30);
  };
  const send = async () => {
    if (q("#opEm")) email = q("#opEm").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || "")) return (q("#opE").textContent = "Enter your work email.");
    q("#opE").textContent = ""; busy(true, "Sending…");
    try { await api("requestCode", { email }); stepTwo(); toast("Code sent to " + email); }
    catch (e) { q("#opE").textContent = e.message === "Failed to fetch" ? "Can't reach the tracker right now." : e.message; busy(false, step === 1 ? "Email me a code" : "Save password"); }
  };
  const stepName = d => {
    step = 3;
    q("#opBody").innerHTML = `<div class="note" style="margin-bottom:10px">Email confirmed. Which one is you? You only do this once.</div>
      <div class="field"><label for="opName">Your name</label><select class="input" id="opName"><option value="">Select your name</option>${d.choices.map(n => `<option ${n === d.suggest ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="__new__">I'm not on this list</option></select></div>
      <div class="field hidden" id="opNewBox"><label for="opNew">Your full name</label><input class="input" id="opNew" autocomplete="name"><div class="note" style="margin-top:4px">Saajid will get an email to give you a role.</div></div>`;
    q("#opName").onchange = () => q("#opNewBox").classList.toggle("hidden", q("#opName").value !== "__new__");
    busy(false, "Finish"); q("#opE").textContent = "";
  };
  const save = async () => {
    let body;
    if (step === 3) {
      const pick = q("#opName").value;
      if (!pick) return (q("#opE").textContent = "Pick your name.");
      if (pick === "__new__" && q("#opNew").value.trim().length < 2) return (q("#opE").textContent = "Type your name.");
      body = { ...saved, claimName: pick, newName: pick === "__new__" ? q("#opNew").value.trim() : "" };
    } else {
      const code = q("#opCode").value.replace(/\D/g, ""), a = q("#opP1").value, b = q("#opP2").value;
      if (code.length !== 6) return (q("#opE").textContent = "Enter the 6-digit code from the email.");
      if (a.length < 8) return (q("#opE").textContent = "Use at least 8 characters.");
      if (a !== b) return (q("#opE").textContent = "The two passwords don't match.");
      body = saved = { email, code, password: a };
    }
    q("#opE").textContent = ""; busy(true, "Saving…");
    try {
      const r = await api("setOwnPassword", body);
      close();
      store.set("ytb_email", email); S.token = r.token; store.set("ytb_demo_token", r.token);
      applyData(r); cacheNow();
      if (fromLogin) { $("#lpw").value = ""; if ($("#lclaimBox")) $("#lclaimBox").remove(); $("#loginErr").textContent = ""; showApp(); } else render();
      toast("Password saved. Use it next time you sign in.");
    } catch (e) {
      if (e.data && e.data.needName) return stepName(e.data);
      if (e.data && e.data.noRole) { close(); if (fromLogin) $("#loginErr").textContent = e.message; else toast(e.message, true); return; }
      q("#opE").textContent = e.message; busy(false, step === 3 ? "Finish" : "Save password");
    }
  };
  q("#opGo").onclick = () => step === 1 ? send() : save();
  root.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); q("#opGo").click(); } if (e.key === "Escape") close(); });
  stepOne();
}
if ($("#lForgot")) $("#lForgot").onclick = () => openOwnPw($("#lemail").value.trim().toLowerCase(), true);

let toastTimer;
function toast(msg, bad) {
  let el = $(".toast"); if (!el) { el = document.createElement("div"); el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}

    const b = $("#signOutAll");
    if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = "Click again: sign everyone out"; return; }
    try { await api("signOutAll"); logout(); $("#loginErr").textContent = "Everyone has been signed out. Sign in again to continue."; } catch (err) { toast(err.message, true); }
  };
}

// ---------------------------------------------------------------- assistant (admins + owners)
// helpers the assistant uses
const asAll = () => D.videos.concat((D.history || []).map(h => ({ ...h, status: "Published" })));
const isActive = t => !isDone(t) && t.status !== "On hold";
const isDueSoon = t => !!t.dueDate && !isDone(t) && t.dueDate >= TODAY && t.dueDate <= addDays(TODAY, 2);
const monthStart = () => TODAY.slice(0, 8) + "01";
const deliveredThisMonth = t => isDone(t) && finishedOn(t) >= monthStart();
const qcFailed = t => t.qcResult === "Failed – fixes needed";

// Answers questions about the tracker from the data already on the page. No AI service, so it
// is free and instant. It understands people, channels, stages and time words ("this month").
const AS = { open: false, msgs: [], busy: false, activity: null };
try { AS.msgs = JSON.parse(store.get("ytb_demo_asst") || "[]").slice(-60); } catch (e) { AS.msgs = []; }
const asSave = () => store.set("ytb_demo_asst", JSON.stringify(AS.msgs.slice(-60)));
const AS_SUGGEST = ["How many times did someone miss the deadline this month?", "Who has missed the most deadlines?", "What is overdue right now?",
  "Who has the most work?", "What's due this week?", "How many videos are in client review?", "What is Jerin working on?", "Which videos failed QC?",
  "What's blocked?", "Most revisions", "How many videos were published last month?", "What changed today?"];
const SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>';

// ---------- understanding the question
function asRange(q) {
  const t = TODAY, d = n => addDays(t, n);
  const [y, m] = t.split("-").map(Number);
  const mStart = (yy, mm) => `${yy}-${String(mm).padStart(2, "0")}-01`;
  const wd = (() => { const [a, b, c] = t.split("-").map(Number); return (new Date(a, b - 1, c).getDay() + 6) % 7; })();
  let r;
  if (/\btoday\b/.test(q)) r = [t, t, "today"];
  else if (/\byesterday\b/.test(q)) r = [d(-1), d(-1), "yesterday"];
  else if (/\blast week\b/.test(q)) r = [d(-wd - 7), d(-wd - 1), "last week"];
  else if (/\bthis week\b|\bweek\b/.test(q)) r = [d(-wd), d(6 - wd), "this week"];
  else if (/\blast month\b/.test(q)) { const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; r = [mStart(py, pm), addDays(mStart(y, m), -1), "last month"]; }
  else if (/\bthis month\b|\bmonth\b/.test(q)) r = [mStart(y, m), d(0), "this month"];
  else { const n = q.match(/\blast (\d{1,3}) days?\b/); if (n) r = [d(-Number(n[1])), t, `in the last ${n[1]} days`]; }
  return r ? { from: r[0], to: r[1], label: r[2] } : null;
}
const asInRange = (date, R) => !R || (!!date && date >= R.from && date <= R.to);
function asPeople() { return D.people.map(p => p.name); }
function asFind(q, list) {
  const hits = [];
  list.forEach(n => {
    const full = n.toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").trim();
    const first = full.split(/\s+/)[0];
    const re = s => new RegExp(`(^|[^a-z])${s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-z]|$)`);
    if (re(full).test(q) || (first.length > 3 && re(first).test(q) && list.filter(x => x.toLowerCase().startsWith(first)).length === 1)) hits.push(n);
  });
  return hits;
}
function asStage(q) {
  const st = PRE.concat(POST).slice().sort((a, b) => b.length - a.length);
  return st.find(s => q.includes(s.toLowerCase())) || (/\breview\b/.test(q) && !/internal/.test(q) ? "Client review" : "");
}

// ---------- building answers
const asLink = t => `<button type="button" class="as-v" data-id="${esc(t.id)}">${esc(t.title)}</button>`;
function asTable(rows, head) {
  return `<table class="as-t"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function asList(T, extra, max = 8) {
  if (!T.length) return "";
  const shown = T.slice(0, max);
  return `<ul class="as-l">${shown.map(t => `<li>${asLink(t)} <span class="note">· ${esc(editorsOf(t).join(" + "))} · ${esc(t.status)}${extra ? " · " + extra(t) : ""}</span></li>`).join("")}</ul>`
    + (T.length > max ? `<div class="note">…and ${T.length - max} more. Open the Table view to see them all.</div>` : "");
}
const missedOf = t => !!t.dueDate && (isOverdue(t) || (isDone(t) && finishedOn(t) && finishedOn(t) > t.dueDate));
const missedDate = t => isDone(t) ? finishedOn(t) : t.dueDate;
const daysLateOf = t => isDone(t) ? dayDiff(t.dueDate, finishedOn(t)) : dayDiff(t.dueDate, TODAY);

async function asAnswer(raw) {
  const q = " " + raw.toLowerCase().replace(/[?!.,]/g, " ").replace(/\s+/g, " ") + " ";
  const R = asRange(q), rl = R ? ` ${R.label}` : "";
  const ppl = asFind(q, asPeople()), who = ppl[0];
  const chans = asFind(q, channelNames()), ch = chans[0];
  const stage = asStage(q);
  let T = asAll();
  if (who) T = T.filter(t => onVideo(t, who));
  if (ch) T = T.filter(t => t.client === ch);
  const scope = [who, ch].filter(Boolean).join(", ");
  const sc = scope ? ` for ${esc(scope)}` : "";

  if (/\b(help|what can you|how do i use)\b/.test(q)) return { html: `I answer questions about the videos in this tracker: deadlines, overdue work, workload, stages, channels, QC, revisions, blockers and recent changes. Mention a person, a channel or a time ("this week", "last month", "last 30 days") to narrow it down.`, chips: AS_SUGGEST.slice(0, 6) };

  // recent changes (Activity log)
  if (/\b(changed|change|changes|edited|updated|activity|who did|happened)\b/.test(q)) {
    if (!AS.activity) { try { AS.activity = (await api("activity", { limit: 1000 })).items; } catch (e) { return { html: `I couldn't load the Activity log: ${esc(e.message)}` }; } }
    const RR = R || { from: TODAY, to: TODAY, label: "today" };
    let L = AS.activity.filter(a => asInRange(String(a.time).slice(0, 10), RR));
    if (who) L = L.filter(a => String(a.who).toLowerCase().includes(who.toLowerCase().split(" ")[0]));
    if (!L.length) return { html: `No changes ${RR.label}${sc}.` };
    const byWho = {}; L.forEach(a => byWho[a.who] = (byWho[a.who] || 0) + 1);
    return { html: `<b>${L.length}</b> change${L.length === 1 ? "" : "s"} ${RR.label}${sc}.<br>${asTable(Object.entries(byWho).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([w, n]) => [esc(w), n]), ["Who", "Changes"])}
      <ul class="as-l">${L.slice(0, 6).map(a => `<li><b>${esc(a.video || "Settings")}</b> <span class="note">· ${esc(a.who)} · ${esc(a.what)}</span></li>`).join("")}</ul>`, chips: ["Open the Activity page"] };
  }

  // missed deadlines / timelines
  if (/\b(miss|missed|missing|late|deadline|deadlines|timeline|timelines|delay|delayed|behind)\b/.test(q) && !/\boverdue\b.*\bnow\b/.test(q)) {
    const M = T.filter(missedOf).filter(t => asInRange(missedDate(t), R));
    if (!M.length) return { html: `No missed deadlines${rl}${sc}. 🎉`, chips: ["What is overdue right now?", "What's due this week?"] };
    const per = {}; M.forEach(t => editorsOf(t).forEach(e => per[e] = (per[e] || 0) + 1));
    const rows = Object.entries(per).sort((a, b) => b[1] - a[1]);
    const still = M.filter(t => !isDone(t)).length, wasLate = M.length - still;
    const worst = M.slice().sort((a, b) => daysLateOf(b) - daysLateOf(a));
    return { html: `<b>${M.length}</b> video${M.length === 1 ? "" : "s"} missed the deadline${rl}${sc}: <b>${still}</b> still overdue and <b>${wasLate}</b> uploaded late.
      ${who ? "" : asTable(rows.slice(0, 10).map(([e, n]) => [esc(e), n]), ["Editor", "Missed"])}
      <div class="note" style="margin:6px 0 2px">Latest by days late:</div>${asList(worst, t => `${daysLateOf(t)}d late`, 6)}
      <div class="note">Counts videos past their due date, plus videos uploaded after it (published ones included). A video shared by two editors counts for both.</div>`,
      chips: ["Who has missed the most deadlines?", "What is overdue right now?", "Missed deadlines last month"] };
  }

  if (/\boverdue\b/.test(q)) {
    const O = T.filter(isOverdue).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    return O.length ? { html: `<b>${O.length}</b> overdue right now${sc}.${asList(O, t => `${dayDiff(t.dueDate, TODAY)}d late`)}` } : { html: `Nothing is overdue${sc}. 🎉` };
  }

  if (/\bdue\b/.test(q)) {
    const RR = R || { from: TODAY, to: addDays(TODAY, 2), label: "in the next 48 hours" };
    if (RR.from < TODAY) RR.from = TODAY;   // "due" means still to come; past ones are overdue
    const U = T.filter(t => t.dueDate && !isDone(t) && asInRange(t.dueDate, RR)).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    return U.length ? { html: `<b>${U.length}</b> due ${RR.label}${sc}.${asList(U, t => `due ${fmtDate(t.dueDate)}`)}` } : { html: `Nothing is due ${RR.label}${sc}.` };
  }

  if (/\b(qc|quality)\b/.test(q)) {
    const F = T.filter(qcFailed); const P = T.filter(t => t.qcResult === "Passed").length;
    return { html: `<b>${F.length}</b> video${F.length === 1 ? "" : "s"} failed QC and need fixes${sc}; <b>${P}</b> passed.${asList(F)}` };
  }

  if (/\b(block|blocked|blocker|blockers|stuck|waiting)\b/.test(q)) {
    const B = T.filter(t => t.blocker && !isDone(t));
    return B.length ? { html: `<b>${B.length}</b> video${B.length === 1 ? " is" : "s are"} blocked${sc}.${asList(B, t => `“${esc(t.blocker)}”`)}` } : { html: `Nothing is blocked${sc}.` };
  }

  if (/\brevision|revisions\b/.test(q)) {
    const V = T.filter(t => Number(t.revisions) > 0).sort((a, b) => Number(b.revisions) - Number(a.revisions));
    const avg = T.length ? (T.reduce((s, t) => s + (Number(t.revisions) || 0), 0) / T.length) : 0;
    return { html: `Average <b>${avg.toFixed(1)}</b> revisions per video${sc}. Most revisions:${asList(V, t => `${t.revisions} rev.`, 6)}` };
  }

  if (/\b(delivered|uploaded|published|finished|completed|done|shipped)\b/.test(q)) {
    const RR = R || { from: monthStart(), to: TODAY, label: "this month" };
    const DV = T.filter(t => isDone(t) && asInRange(finishedOn(t), RR));
    const per = {}; DV.forEach(t => editorsOf(t).forEach(e => per[e] = (per[e] || 0) + 1));
    return { html: `<b>${DV.length}</b> video${DV.length === 1 ? "" : "s"} uploaded or published ${RR.label}${sc}.${DV.length && !who ? asTable(Object.entries(per).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([e, n]) => [esc(e), n]), ["Editor", "Done"]) : ""}` };
  }

  if (/\b(most work|busiest|workload|free|least work|capacity|available)\b/.test(q)) {
    const rows = asPeople().map(p => { const A = D.videos.filter(t => onVideo(t, p) && isActive(t)); return [p, A.length, A.filter(isOverdue).length]; }).filter(r => r[1] || peopleWith("editor").includes(r[0]));
    const least = /\b(free|least|available|capacity)\b/.test(q);
    rows.sort((a, b) => least ? a[1] - b[1] : b[1] - a[1]);
    return { html: `${least ? "Lightest" : "Heaviest"} workload right now (active videos):${asTable(rows.slice(0, 10).map(r => [esc(r[0]), r[1], r[2] ? `<span class="tag late">${r[2]} late</span>` : "0"]), ["Person", "Active", "Overdue"])}` };
  }

  if (stage) {
    const X = T.filter(t => t.status === stage);
    return { html: `<b>${X.length}</b> video${X.length === 1 ? "" : "s"} in <b>${esc(stage)}</b>${sc}.${asList(X)}` };
  }

  if (who) {
    const A = T.filter(isActive);
    return { html: `<b>${esc(who)}</b> is on <b>${A.length}</b> active video${A.length === 1 ? "" : "s"} (${A.filter(isOverdue).length} overdue).${asList(A, t => t.dueDate ? `due ${fmtDate(t.dueDate)}` : "")}`, chips: [`How many deadlines did ${who} miss this month?`] };
  }
  if (ch) {
    const by = {}; T.filter(t => !isDone(t)).forEach(t => by[t.status] = (by[t.status] || 0) + 1);
    return { html: `<b>${chName(ch)}</b>: ${T.filter(t => !isDone(t)).length} open, ${T.filter(isOverdue).length} overdue, ${T.filter(isDone).length} uploaded or published.${asTable(Object.entries(by).map(([s, n]) => [esc(s), n]), ["Stage", "Videos"])}` };
  }

  if (/\b(how many|total|count|number)\b/.test(q)) {
    return { html: `There are <b>${D.videos.filter(isActive).length}</b> active videos, <b>${D.videos.filter(isOverdue).length}</b> overdue, <b>${D.videos.filter(isDueSoon).length}</b> due in the next 48 hours and <b>${asAll().filter(deliveredThisMonth).length}</b> uploaded or published this month.` };
  }

  return { html: `I'm not sure how to answer that one. I'm a built-in assistant (no AI), so I work best with questions about deadlines, overdue work, workload, stages, channels, QC, revisions, blockers and recent changes. Try one of these:`, chips: AS_SUGGEST.slice(0, 6) };
}

// ---------- chat UI (bubble + full page share one conversation)
function asMsgsHTML() {

    <div class="as-chips">${AS_SUGGEST.slice(0, 5).map(s => `<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  return AS.msgs.map(m => m.me ? `<div class="as-m me">${esc(m.text)}</div>`
    : `<div class="as-m bot">${m.html}${m.chips && m.chips.length ? `<div class="as-chips">${m.chips.map(s => `<button type="button" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}</div>`).join("")
    + (AS.busy ? `<div class="as-m bot"><span class="as-dots"><i></i><i></i><i></i></span></div>` : "");
}
function asForm(id) {
  return `<form class="as-in" data-asform="${id}"><input type="text" class="input" placeholder="Ask a question…" aria-label="Ask the assistant" autocomplete="off">
    <button class="btn primary" aria-label="Send"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>`;
}
function asBind(root) {
  root.querySelectorAll("[data-q]").forEach(b => b.onclick = () => asAsk(b.dataset.q));
  root.querySelectorAll(".as-v").forEach(b => b.onclick = () => { const t = D.videos.find(x => x.id === b.dataset.id); if (t) openVideo(t); else toast("That one is published; see History"); });
  root.querySelectorAll("[data-asform]").forEach(f => f.onsubmit = e => { e.preventDefault(); const i = f.querySelector("input"); const v = i.value.trim(); if (v) { i.value = ""; asAsk(v); } });
  const sc = root.querySelector(".as-body"); if (sc) sc.scrollTop = sc.scrollHeight;
}
async function asAsk(text) {
  if (text === "Open the Activity page") return go("activity");
  AS.msgs.push({ me: true, text }); AS.busy = true; asRefresh();
  let a; try { a = await asAnswer(text); } catch (e) { a = { html: `Something went wrong: ${esc(e.message)}` }; }
  AS.busy = false; AS.msgs.push({ html: a.html, chips: a.chips || [] }); asSave(); asRefresh();
}
function asRefresh() {
  const p = $("#asPanel .as-body"); if (p) { p.innerHTML = asMsgsHTML(); asBind($("#asPanel")); }
  const f = $("#asPage .as-body"); if (f) { f.innerHTML = asMsgsHTML(); asBind($("#asPage")); }

  if ($("#asPanel")) return;

      <button class="icon-btn" id="asExpand" title="Open full page" aria-label="Open full page"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
      <button class="icon-btn" id="asClose" title="Close" aria-label="Close">×</button></div>

  $("#asExpand").onclick = () => { AS.open = false; go("assistant"); };

// What the Google Sheet behind the tracker looks like with this data
function renderSheet() {
  const tabs = DEMO.sheetData();
  if (!S.sheetTab || !tabs.some(t => t.name === S.sheetTab)) S.sheetTab = "Videos";
  const t = tabs.find(x => x.name === S.sheetTab);
  const colL = n => { let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const rows = t.rows.filter(r => r && r.some(x => x !== "" && x !== null && x !== undefined));
  const width = Math.max(...rows.map(r => r.length), 1);
  const show = v => { if (v === null || v === undefined) return ""; const s = String(v); return s.startsWith("{") && s.length > 40 ? s.slice(0, 38) + "…" : s; };
  $("#view").innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap"><h1 class="grot" style="margin:0;font-size:22px">The Google Sheet</h1>
      <span class="note">This is what the real Google Sheet looks like with this sample data. The website writes every change here. Hidden tabs are marked.</span></div>
    <div class="gs">
      <div class="gs-grid"><table><thead><tr><th class="rn"></th>${Array.from({ length: width }, (_, i) => `<th>${colL(i)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${i === 0 ? "hdr" : ""}"><td class="rn">${i + 1}</td>${Array.from({ length: width }, (_, j) => `<td>${esc(show(r[j]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="gs-tabs">${tabs.map(x => `<button class="${x.name === S.sheetTab ? "on" : ""}" data-gs="${esc(x.name)}">${esc(x.name)}${x.hidden ? ` <small>hidden</small>` : ""}</button>`).join("")}</div>
    </div>`;
  document.querySelectorAll("[data-gs]").forEach(b => b.onclick = () => { S.sheetTab = b.dataset.gs; renderSheet(); });
}

// ---------------------------------------------------------------- start (demo)
(async function demoStart() {
  $("#rolePick").innerHTML = DEMO_ROLES.map(x => `<button type="button" data-role="${x.k}">${x.label}</button>`).join("");
  $("#rolePick").querySelectorAll("button").forEach(b => b.onclick = () => demoSignInRole(b.dataset.role));
  const as = new URLSearchParams(location.search).get("as");
  const who = store.get("ytb_demo_who");
  if (as && DEMO_ROLES.some(r => r.k === as)) demoSignInRole(as);
  else if (who && DEMO.people().some(p => p.name === who)) demoSignIn(DEMO.people().find(p => p.name === who));
  else { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
})();

// ---------------------------------------------------------------- styled dropdowns
// Every <select> keeps working as before (same value, same change events), but its open list is
// drawn in the tracker's own style instead of the browser's grey system menu. Long lists get a
// search box; channel lists show their logos. Touch screens keep the phone's own picker.
(function () {
  if (!window.matchMedia || !matchMedia("(pointer: fine)").matches) return;
  const LOGO_IDS = { m_client: 1, fClient: 1 };
  let pop = null, cur = null, items = [], hi = -1;

  function close() {
    if (!pop) return;
    pop.remove(); pop = null;
    if (cur) { cur.classList.remove("ns-open"); cur.focus({ preventScroll: true }); }
    cur = null; items = []; hi = -1;
  }
  function pick(i) {
    const it = items[i]; if (!it || it.disabled) return;
    const s = cur;
    if (s.value !== it.value) {
      s.value = it.value;
      s.dispatchEvent(new Event("input", { bubbles: true }));
      s.dispatchEvent(new Event("change", { bubbles: true }));
    }
    close();
  }
  function setHi(i, scroll) {
    const vis = items.filter(x => !x.hidden && !x.disabled);
    if (!vis.length) { hi = -1; return; }
    hi = i;
    pop.querySelectorAll(".ns-o").forEach(el => el.classList.toggle("hi", +el.dataset.i === hi));
    if (scroll) { const el = pop.querySelector(`.ns-o[data-i="${hi}"]`); el && el.scrollIntoView({ block: "nearest" }); }
  }
  function move(d) {
    const vis = items.filter(x => !x.hidden && !x.disabled).map(x => x.i);
    if (!vis.length) return;
    const at = vis.indexOf(hi);
    setHi(vis[at < 0 ? (d > 0 ? 0 : vis.length - 1) : Math.max(0, Math.min(vis.length - 1, at + d))], true);
  }
  function filter(q) {
    q = q.trim().toLowerCase();
    items.forEach(it => { it.hidden = !!q && !it.label.toLowerCase().includes(q); it.el.style.display = it.hidden ? "none" : ""; });
    pop.querySelectorAll(".ns-g").forEach(g => {
      let n = g.nextElementSibling, any = false;
      while (n && !n.classList.contains("ns-g")) { if (n.style.display !== "none") any = true; n = n.nextElementSibling; }
      g.style.display = any ? "" : "none";
    });
    const empty = pop.querySelector(".ns-empty"); if (empty) empty.style.display = items.some(x => !x.hidden) ? "none" : "";
    const first = items.find(x => !x.hidden && !x.disabled); setHi(first ? first.i : -1, true);
  }
  function place() {
    if (!pop || !cur) return;
    const r = cur.getBoundingClientRect(), vh = window.innerHeight, vw = window.innerWidth;
    const w = Math.max(r.width, 200);
    pop.style.minWidth = w + "px";
    pop.style.left = Math.max(8, Math.min(r.left, vw - pop.offsetWidth - 8)) + "px";
    const below = vh - r.bottom - 12, above = r.top - 12;
    const up = below < 220 && above > below;
    const room = Math.max(160, Math.min(340, up ? above : below));
    pop.querySelector(".ns-list").style.maxHeight = (room - (pop.querySelector(".ns-q") ? 46 : 8)) + "px";
    pop.style.top = up ? Math.max(8, r.top - pop.offsetHeight - 6) + "px" : (r.bottom + 6) + "px";
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function open(s) {
    close();
    cur = s; s.classList.add("ns-open");
    const withLogo = LOGO_IDS[s.id] && typeof window.chLogo === "function";
    const opts = [...s.options];
    items = []; let html = "", lastGroup = null;
    opts.forEach((o, i) => {
      const g = o.parentElement && o.parentElement.tagName === "OPTGROUP" ? o.parentElement.label : null;
      if (g !== lastGroup && g) html += `<div class="ns-g">${esc(g)}</div>`;
      lastGroup = g;
      const label = o.textContent, ph = o.value === "" && i === 0;
      const lg = withLogo && !ph && o.value ? window.chLogo(o.value) : "";
      html += `<div class="ns-o${o.selected ? " sel" : ""}${o.disabled ? " dis" : ""}${ph ? " ph" : ""}" data-i="${i}" role="option" aria-selected="${o.selected}">`
        + `${lg}<span class="ns-t">${esc(label)}</span>${o.selected && !ph ? '<svg class="ns-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : ""}</div>`;
      items.push({ i, value: o.value, label, disabled: o.disabled, hidden: false });
    });
    const search = opts.length > 9;
    pop = document.createElement("div");
    pop.className = "ns-pop"; pop.setAttribute("role", "listbox");
    pop.innerHTML = (search ? `<input class="ns-q" type="text" placeholder="Search…" aria-label="Search options">` : "")
      + `<div class="ns-list">${html}<div class="ns-empty" style="display:none">No matches</div></div>`;
    document.body.appendChild(pop);
    pop.querySelectorAll(".ns-o").forEach(el => { items[+el.dataset.i].el = el; });
    pop.addEventListener("mousedown", e => e.preventDefault());
    pop.addEventListener("click", e => { const o = e.target.closest(".ns-o"); if (o) pick(+o.dataset.i); });
    pop.addEventListener("mousemove", e => { const o = e.target.closest(".ns-o"); if (o && +o.dataset.i !== hi && !o.classList.contains("dis")) setHi(+o.dataset.i, false); });
    const q = pop.querySelector(".ns-q");
    if (q) { q.addEventListener("input", () => filter(q.value)); q.addEventListener("keydown", keys); q.addEventListener("mousedown", e => e.stopPropagation(), true); }
    place();
    setHi(s.selectedIndex >= 0 ? s.selectedIndex : 0, true);
    if (q) q.focus({ preventScroll: true });
  }
  function keys(e) {
    if (!pop) return;
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") { e.preventDefault(); if (hi >= 0) pick(hi); }
    else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); close(); }
  }
  const usable = s => s && s.tagName === "SELECT" && !s.disabled && !s.multiple && !s.closest("[data-native]");
  document.addEventListener("mousedown", e => {
    const s = e.target.closest && e.target.closest("select");
    if (usable(s)) { e.preventDefault(); s.focus({ preventScroll: true }); if (cur === s) close(); else open(s); return; }
    if (pop && !pop.contains(e.target)) close();
  }, true);
  document.addEventListener("keydown", e => {
    if (pop) {
      if (e.target === cur || e.target.classList.contains("ns-q")) return e.target === cur ? keys(e) : undefined;
      return;
    }
    const s = e.target;
    if (usable(s) && (e.key === " " || e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp") && !e.altKey) { e.preventDefault(); open(s); }
  }, true);
  window.addEventListener("resize", close);
  document.addEventListener("scroll", e => { if (pop && !pop.contains(e.target)) close(); }, true);
})();
</script>
